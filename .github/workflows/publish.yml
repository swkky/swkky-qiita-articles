name: Publish articles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get changed markdown files
        id: files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "^articles/.*\.md$" > changed_files.txt || true
          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📋 Changed files:"
            cat changed_files.txt
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ No article changes detected"
          fi

      - name: Process articles
        if: steps.files.outputs.has_changes == 'true'
        run: |
          for file in $(cat changed_files.txt); do
            filename=$(basename "$file" .md)
            qiita_file="qiita/public/$filename.md"

            # ファイルが削除された場合
            if [ ! -f "$file" ]; then
              echo "🗑️ Article deleted: $file"
              if [ -f "$qiita_file" ]; then
                item_id=$(grep "^id:" "$qiita_file" | awk '{print $2}' | tr -d '"' | tr -d "'")
                if [ -n "$item_id" ] && [ "$item_id" != "null" ]; then
                  echo "🗑️ Deleting from Qiita: $item_id"
                  curl -s -X DELETE "https://qiita.com/api/v2/items/$item_id" \
                    -H "Authorization: Bearer $QIITA_TOKEN"
                fi
                rm "$qiita_file"
              fi
              continue
            fi

            # published: false の場合 → スキップ（Qiitaは公開後に非公開化できない仕様）
            if grep -q "published: false" "$file"; then
              echo "⏭️ Skip: $file (published: false, Qiita does not support unpublishing)"
              continue
            fi

            # published: true の場合 → 変換して投稿
            if grep -q "published: true" "$file"; then
              echo "🚀 Converting: $file"
              node scripts/convert.js "$file" "$qiita_file" --repo-url "$REPO_URL"
            fi
          done

      - name: Publish to Qiita
        if: steps.files.outputs.has_changes == 'true'
        run: |
          for qiita_file in qiita/public/*.md; do
            [ -f "$qiita_file" ] || continue

            # front matterをパース
            title=$(sed -n 's/^title: *//p' "$qiita_file" | tr -d '"')
            private=$(sed -n 's/^private: *//p' "$qiita_file")
            item_id=$(sed -n 's/^id: *//p' "$qiita_file" | tr -d '"' | tr -d "'")
            slide=$(sed -n 's/^slide: *//p' "$qiita_file")

            # tagsをJSON配列に変換
            tags=$(awk '/^tags:/{found=1; next} found && /^  - /{gsub(/^  - /,""); names=names"\""$0"\","; next} found{exit} END{gsub(/,$/,"",names); print "["names"]"}' "$qiita_file")
            tags_json=$(echo "$tags" | jq '[.[] | {name: ., versions: []}]')

            # 本文を取得（front matter以降）
            body=$(awk 'BEGIN{n=0} /^---$/{n++; if(n==2){found=1; next}} found{print}' "$qiita_file")
            body_json=$(echo "$body" | jq -Rs .)

            if [ -z "$item_id" ] || [ "$item_id" = "null" ]; then
              # 新規投稿
              echo "📝 Creating new article: $title"
              response=$(curl -s -X POST "https://qiita.com/api/v2/items" \
                -H "Authorization: Bearer $QIITA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$title\",\"body\":$body_json,\"tags\":$tags_json,\"private\":$private,\"slide\":${slide:-false}}")
              new_id=$(echo "$response" | jq -r '.id')
              if [ -n "$new_id" ] && [ "$new_id" != "null" ]; then
                echo "✅ Published: $new_id"
                # idをファイルに書き戻す
                sed -i "s/^id: .*/id: $new_id/" "$qiita_file"
              else
                echo "❌ Failed to publish: $(echo "$response" | jq -r '.message // .type // "unknown error"')"
              fi
            else
              # 更新
              echo "📝 Updating article: $item_id"
              response=$(curl -s -X PATCH "https://qiita.com/api/v2/items/$item_id" \
                -H "Authorization: Bearer $QIITA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$title\",\"body\":$body_json,\"tags\":$tags_json,\"private\":$private,\"slide\":${slide:-false}}")
              echo "✅ Updated: $item_id"
            fi
          done

      - name: Commit and push changes
        if: steps.files.outputs.has_changes == 'true'
        run: |
          rm -f changed_files.txt package-lock.json
          # qiita-cliのpackage.jsonを削除（ルートのpackage.jsonは保持）
          git checkout -- package.json 2>/dev/null || true
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git add qiita/public/
          if git diff --cached --quiet; then
            echo "⏭️ No changes to commit"
          else
            git commit -m "Sync Qiita articles"
            git push
          fi
